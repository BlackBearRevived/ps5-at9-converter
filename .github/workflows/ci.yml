name: Build

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.x"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          # Python 3.9 builds are unavailable on Ubuntu 26.04.
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the converter
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Conversion smoke test
        run: ps5-at9-converter --input tests/data/tone-44k-stereo.mp3 --output snd0.at9 --duration max --preview preview.wav

  package:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and check the wheel and source distribution
        run: |
          python -m pip install build twine
          version=$(python -c 'from ps5at9 import __version__; print(__version__)')
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 2
          fi
          python -m build
          python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Test both installable packages outside the checkout
        run: |
          set -euo pipefail
          for package in "$PWD"/dist/*.whl "$PWD"/dist/*.tar.gz; do
            work=$(mktemp -d "$RUNNER_TEMP/at9-install.XXXXXX")
            python -m venv "$work/venv"
            "$work/venv/bin/python" -m pip install "$package"
            "$work/venv/bin/python" -m pip check
            (cd "$work" && ./venv/bin/ps5-at9-converter --version &&
              ./venv/bin/ps5-at9-converter --input "$GITHUB_WORKSPACE/tests/data/tone-44k-stereo.mp3" --output snd0.at9 --duration max &&
              test -s snd0.at9)
          done
      - name: Build and test the source ZIP and zipapp
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=ps5-at9-converter/ \
            --output "dist/ps5-at9-converter-$GITHUB_REF_NAME.zip" HEAD
          stage=$(mktemp -d "$RUNNER_TEMP/at9-zipapp.XXXXXX")
          cp -r ps5at9 "$stage/"
          cp ps5_at9.py "$stage/__main__.py"
          python -m zipapp "$stage" -o dist/ps5-at9-converter.pyz -p "/usr/bin/env python3" -c
          python -m pip install numpy
          python dist/ps5-at9-converter.pyz --input tests/data/tone-44k-stereo.mp3 --output "$RUNNER_TEMP/check.at9" --duration max
      - name: Write distribution checksums
        run: |
          cd dist
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  attest:
    needs: package
    if: github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist/
      - name: Verify the packages downloaded from the build
        run: cd dist && sha256sum -c --strict SHA256SUMS.txt
      - name: Sign GitHub Actions provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

  release:
    needs: attest
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist/
      - name: Publish the verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c --strict SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "PS5 AT9 Converter $GITHUB_REF_NAME"
